# CI/CD for gipityChat
#
#  * Every push / pull request: run the plugin tests.
#  * Release: when plugin/gipity-chat/plugin.json's "version" on main has no
#    GitHub Release yet, tag it (v<version>) and publish the plugin zip, ready for
#    mod.io and dev_plugins. So to release: bump "version", commit, push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install lupa
      - name: Check manifest
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("plugin/gipity-chat/plugin.json"))
          for field in ("name", "version", "contactEmailAddress", "requiredPermissions", "urls"):
              assert field in m, f"plugin.json is missing {field}"
          assert all(c.isdigit() or c == "." for c in m["version"]), "mod.io versions are numbers and dots only"
          assert "example.com" not in m["contactEmailAddress"], "set a real contact email"
          for name, url in m["urls"].items():
              assert url.startswith(("http://", "https://")), f"{name}: URLs must be HTTP or HTTPS"
          print("plugin.json OK")
          EOF
      - name: Plugin end-to-end test (stubbed RS3 API, mock AI provider)
        run: python test/plugin_test.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import json;print(json.load(open('plugin/gipity-chat/plugin.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; bump the version in plugin.json to make a new release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plugin zip (files at the top level, as mod.io requires)
        if: steps.ver.outputs.new == 'true'
        run: cd plugin/gipity-chat && zip -j "../../gipity-chat-${{ steps.ver.outputs.version }}.zip" *.lua plugin.json
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: gipityChat v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install
            Unzip `gipity-chat-${{ steps.ver.outputs.version }}.zip` into `dev_plugins/gipity-chat` in your RS3 beta client folder, then in the console (Alt + `):
            ```
            prf
            pon gipity-chat
            ppr gipity-chat
            ppe gipity-chat chatAccess
            ppe gipity-chat httpAccess
            ```
            Paste your API key in the box that appears, then ask in chat: `!c hello`. See the README for details.

            The same zip is the one to upload to mod.io.
          files: gipity-chat-*.zip
